[package]
name = "series-ripper"
version = "3.0.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"
publish = false
description = "Rips TV series from DVD / Blu-ray / 4K UHD with MakeMKV and names episodes for Plex/Jellyfin"

[[bin]]
name = "series-ripper"
path = "src/main.rs"

# Stand-in for makemkvcon, used by the integration test only (not shipped
# in the Docker image).
[[bin]]
name = "mock-makemkvcon"
path = "src/bin/mock_makemkvcon.rs"
test = false

[dependencies]
axum = "0.7"
base64 = "0.22"
libc = "0.2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
